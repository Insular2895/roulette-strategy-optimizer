<svg xmlns="http://www.w3.org/2000/svg" width="132" height="28" viewBox="0 0 132 28" role="img" aria-labelledby="title desc">
  <title id="title">Python 3.11+ animated badge</title>
  <desc id="desc">Animated local README badge for Python 3.11 plus.</desc>
  <defs>
    <linearGradient id="badgeBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#20252e"/>
      <stop offset="100%" stop-color="#3d6f9f"/>
    </linearGradient>
    <linearGradient id="snakeBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5aa0d8"/>
      <stop offset="100%" stop-color="#2f5d8c"/>
    </linearGradient>
    <linearGradient id="snakeGold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe873"/>
      <stop offset="100%" stop-color="#f0bf32"/>
    </linearGradient>
  </defs>
  <rect width="132" height="28" rx="6" fill="url(#badgeBg)"/>
  <rect x="0.5" y="0.5" width="131" height="27" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
  <g transform="translate(10 5)">
    <path d="M7 0h8a5 5 0 0 1 5 5v4H9a4 4 0 0 0-4 4v1H0V7a7 7 0 0 1 7-7Z" fill="url(#snakeBlue)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M13 18H5a5 5 0 0 1-5-5V9h11a4 4 0 0 0 4-4V4h5v7a7 7 0 0 1-7 7Z" fill="url(#snakeGold)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 1;0 0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="8" cy="4.5" r="1.4" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="13.5" r="1.4" fill="#111827">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="38" y="18" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Python</text>
  <text x="86" y="18" font-family="Inter,Arial,sans-serif" font-size="12" fill="#dce9ff">3.11+</text>
</svg>
