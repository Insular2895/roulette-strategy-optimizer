<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Animated heatmap for the best roulette strategy result</title>
  <desc id="desc">European roulette heatmap showing the net profit obtained by the selected strategy on each number.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="100%" stop-color="#151a21"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 700 24px Arial, sans-serif; fill: #f8fafc; text-anchor: middle; }
      .net { font: 700 13px Arial, sans-serif; fill: #dbe4ef; text-anchor: middle; }
      .small { font: 600 13px Arial, sans-serif; fill: #a9b7c8; }
      .title { font: 800 28px Arial, sans-serif; fill: #f8fafc; }
      .metric { font: 700 13px Arial, sans-serif; fill: #101318; }
      .loss { fill: #842626; }
      .softloss { fill: #262c32; }
      .partial { fill: #604a20; }
      .profit { fill: #195c3b; }
      .hit { fill: #b86b2d; }
      .mega { fill: #d99a28; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#263244"/>

  <text x="40" y="48" class="title">Heatmap du dernier run</text>
  <text x="40" y="76" class="small">Strategie gagnante du batch: random_926_refined_4671 - bankroll misee: 100 EUR</text>
  <g transform="translate(650 31)">
    <rect x="0" y="0" width="114" height="26" rx="6" fill="#2dd4bf"/>
    <text x="57" y="18" class="metric">coverage 67.57%</text>
    <rect x="124" y="0" width="110" height="26" rx="6" fill="#f2c94c"/>
    <text x="179" y="18" class="metric">max +919</text>
    <rect x="244" y="0" width="130" height="26" rx="6" fill="#a78bfa"/>
    <text x="309" y="18" class="metric">MC profit 30.6%</text>
    <rect x="384" y="0" width="126" height="26" rx="6" fill="#ef7d7d"/>
    <text x="447" y="18" class="metric">MC bust 63.8%</text>
  </g>

  <g transform="translate(70 110)" stroke="#cbd5e1" stroke-width="1.4">
    <rect x="0" y="0" width="72" height="216" class="loss"/>
    <text x="36" y="95" class="label">0</text>
    <text x="36" y="124" class="net">-100</text>

    <g transform="translate(72 0)">
      <g transform="translate(0 0)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">3</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(82 0)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">6</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(164 0)"><rect width="82" height="72" class="partial"/><text x="41" y="32" class="label">9</text><text x="41" y="53" class="net">-40</text></g>
      <g transform="translate(246 0)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">12</text><text x="41" y="53" class="net">+139</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3s" repeatCount="indefinite"/></g>
      <g transform="translate(328 0)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">15</text><text x="41" y="53" class="net">+125</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3.4s" repeatCount="indefinite"/></g>
      <g transform="translate(410 0)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">18</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(492 0)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">21</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(574 0)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">24</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(656 0)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">27</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(738 0)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">30</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(820 0)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">33</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(902 0)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">36</text><text x="41" y="53" class="net">-98</text></g>

      <g transform="translate(0 72)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">2</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(82 72)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">5</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(164 72)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">8</text><text x="41" y="53" class="net">+142</text><animate attributeName="opacity" values="0.82;1;0.82" dur="2.6s" repeatCount="indefinite"/></g>
      <g transform="translate(246 72)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">11</text><text x="41" y="53" class="net">+137</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3.2s" repeatCount="indefinite"/></g>
      <g transform="translate(328 72)" filter="url(#glow)"><rect width="82" height="72" class="mega" stroke="#ffe08a" stroke-width="4"/><text x="41" y="32" class="label">14</text><text x="41" y="53" class="net">+919</text><animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="2.2s" repeatCount="indefinite" additive="sum"/></g>
      <g transform="translate(410 72)"><rect width="82" height="72" class="profit"/><text x="41" y="32" class="label">17</text><text x="41" y="53" class="net">+80</text></g>
      <g transform="translate(492 72)"><rect width="82" height="72" class="profit"/><text x="41" y="32" class="label">20</text><text x="41" y="53" class="net">+100</text><animate attributeName="opacity" values="0.86;1;0.86" dur="4s" repeatCount="indefinite"/></g>
      <g transform="translate(574 72)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">23</text><text x="41" y="53" class="net">+134</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3.6s" repeatCount="indefinite"/></g>
      <g transform="translate(656 72)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">26</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(738 72)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">29</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(820 72)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">32</text><text x="41" y="53" class="net">+118</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3.8s" repeatCount="indefinite"/></g>
      <g transform="translate(902 72)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">35</text><text x="41" y="53" class="net">-100</text></g>

      <g transform="translate(0 144)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">1</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(82 144)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">4</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(164 144)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">7</text><text x="41" y="53" class="net">+140</text><animate attributeName="opacity" values="0.82;1;0.82" dur="2.9s" repeatCount="indefinite"/></g>
      <g transform="translate(246 144)"><rect width="82" height="72" class="partial"/><text x="41" y="32" class="label">10</text><text x="41" y="53" class="net">-86</text></g>
      <g transform="translate(328 144)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">13</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(410 144)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">16</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(492 144)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">19</text><text x="41" y="53" class="net">+134</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3.1s" repeatCount="indefinite"/></g>
      <g transform="translate(574 144)"><rect width="82" height="72" class="hit"/><text x="41" y="32" class="label">22</text><text x="41" y="53" class="net">+136</text><animate attributeName="opacity" values="0.82;1;0.82" dur="3.3s" repeatCount="indefinite"/></g>
      <g transform="translate(656 144)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">25</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(738 144)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">28</text><text x="41" y="53" class="net">-98</text></g>
      <g transform="translate(820 144)"><rect width="82" height="72" class="loss"/><text x="41" y="32" class="label">31</text><text x="41" y="53" class="net">-100</text></g>
      <g transform="translate(902 144)"><rect width="82" height="72" class="softloss"/><text x="41" y="32" class="label">34</text><text x="41" y="53" class="net">-98</text></g>
    </g>
  </g>

  <g transform="translate(72 366)">
    <rect x="0" y="-18" width="16" height="16" class="loss"/><text x="24" y="-5" class="small">perte complete</text>
    <rect x="150" y="-18" width="16" height="16" class="softloss"/><text x="174" y="-5" class="small">perte amortie</text>
    <rect x="300" y="-18" width="16" height="16" class="profit"/><text x="324" y="-5" class="small">profit</text>
    <rect x="415" y="-18" width="16" height="16" class="hit"/><text x="439" y="-5" class="small">gros hit</text>
    <rect x="535" y="-18" width="16" height="16" class="mega"/><text x="559" y="-5" class="small">hit explosif</text>
  </g>
  <text x="72" y="400" class="small">Lecture: chaque case montre le gain net si ce numero sort. Le 14 est le point de superposition principal: net +919.</text>
</svg>
