<svg xmlns="http://www.w3.org/2000/svg" width="220" height="28" viewBox="0 0 220 28" role="img" aria-labelledby="title desc">
  <title id="title">V1 planning animated badge</title>
  <desc id="desc">Animated local README badge for project status V1 planning with extra right padding.</desc>
  <defs>
    <linearGradient id="badgeBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#20252e"/>
      <stop offset="100%" stop-color="#6f5d26"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1">
      <stop offset="0%" stop-color="#f2c94c"/>
      <stop offset="100%" stop-color="#ffe08a"/>
    </linearGradient>
  </defs>
  <rect width="220" height="28" rx="6" fill="url(#badgeBg)"/>
  <rect x="0.5" y="0.5" width="219" height="27" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
  <g transform="translate(20 14)">
    <circle r="10.5" fill="#f2c94c" opacity="0.22">
      <animate attributeName="r" values="9.5;12;9.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.42;0.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" fill="url(#chip)" stroke="#fff6c8" stroke-width="1.2"/>
    <g stroke="#5c4217" stroke-width="2" stroke-linecap="round">
      <path d="M0 -8v4M0 4v4M-8 0h4M4 0h4"/>
      <path d="M-5.7 -5.7l2.8 2.8M2.9 2.9l2.8 2.8M5.7 -5.7L2.9 -2.9M-2.9 2.9l-2.8 2.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle r="3.2" fill="#20252e"/>
  </g>
  <text x="42" y="18" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">status</text>
  <text x="88" y="18" font-family="Arial,sans-serif" font-size="12" fill="#ffe08a">V1 planning</text>
</svg>
