<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Roulette Strategy Optimizer animated banner</title>
  <desc id="desc">Dark analytical roulette banner with animated grid, roulette chips and Monte Carlo lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="45%" stop-color="#1f2933"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#f2d16b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <animate attributeName="opacity" values="0.13;0.24;0.13" dur="6s" repeatCount="indefinite"/>
    <path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500M800 0V500M900 0V500M1000 0V500M1100 0V500M1200 0V500M1300 0V500M1400 0V500M1500 0V500"/>
  </g>
  <rect x="-420" y="0" width="360" height="500" fill="url(#scan)" opacity="0.45">
    <animate attributeName="x" values="-420;1660" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(80 100) scale(0.9)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="5.2s" repeatCount="indefinite" additive="sum"/>
    <rect x="0" y="0" width="560" height="300" rx="8" fill="#0f5132" stroke="#d7dde4" stroke-width="3"/>
    <rect x="18" y="18" width="80" height="264" fill="#123d2b" stroke="#d7dde4" stroke-width="2"/>
    <text x="58" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#d7dde4">0</text>
    <g font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#f4f4f4">
      <rect x="110" y="18" width="130" height="82" fill="#8f1d1d" stroke="#d7dde4"/>
      <text x="175" y="70">17</text>
      <rect x="240" y="18" width="130" height="82" fill="#111111" stroke="#d7dde4"/>
      <text x="305" y="70">20</text>
      <rect x="370" y="18" width="130" height="82" fill="#8f1d1d" stroke="#d7dde4"/>
      <text x="435" y="70">23</text>
      <rect x="110" y="100" width="130" height="82" fill="#111111" stroke="#d7dde4"/>
      <text x="175" y="152">16</text>
      <rect x="240" y="100" width="130" height="82" fill="#8f1d1d" stroke="#d7dde4"/>
      <text x="305" y="152">19</text>
      <rect x="370" y="100" width="130" height="82" fill="#111111" stroke="#d7dde4"/>
      <text x="435" y="152">22</text>
      <rect x="110" y="182" width="130" height="82" fill="#8f1d1d" stroke="#d7dde4"/>
      <text x="175" y="234">15</text>
      <rect x="240" y="182" width="130" height="82" fill="#111111" stroke="#d7dde4"/>
      <text x="305" y="234">18</text>
      <rect x="370" y="182" width="130" height="82" fill="#8f1d1d" stroke="#d7dde4"/>
      <text x="435" y="234">21</text>
    </g>
    <circle cx="175" cy="59" r="34" fill="#7c3aed" opacity="0.72">
      <animate attributeName="r" values="31;38;31" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.86;0.55" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="305" cy="59" r="28" fill="#f2d16b" opacity="0.78">
      <animate attributeName="r" values="25;32;25" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.92;0.55" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="305" cy="141" r="46" fill="#2dd4bf" opacity="0.34">
      <animate attributeName="r" values="41;51;41" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.22;0.46;0.22" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M690 350C790 300 880 370 960 310S1090 170 1180 230 1330 390 1460 210" stroke="#2dd4bf" stroke-width="7" opacity="0.16"/>
    <path d="M690 285C810 260 890 245 955 265S1080 335 1175 285 1300 160 1460 190" stroke="#f2d16b" stroke-width="7" opacity="0.16"/>
    <path d="M690 400C830 410 920 330 990 350S1120 430 1205 360 1325 285 1460 315" stroke="#a78bfa" stroke-width="6" opacity="0.16"/>
    <path pathLength="1" d="M690 350C790 300 880 370 960 310S1090 170 1180 230 1330 390 1460 210" stroke="#2dd4bf" stroke-width="5" opacity="0.82" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.9;0.72;0.45" dur="5.8s" repeatCount="indefinite"/>
    </path>
    <path pathLength="1" d="M690 285C810 260 890 245 955 265S1080 335 1175 285 1300 160 1460 190" stroke="#f2d16b" stroke-width="5" opacity="0.82" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" dur="6.4s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.9;0.72;0.45" dur="6.4s" repeatCount="indefinite"/>
    </path>
    <path pathLength="1" d="M690 400C830 410 920 330 990 350S1120 430 1205 360 1325 285 1460 315" stroke="#a78bfa" stroke-width="4" opacity="0.82" stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0;0" dur="7s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.38;0.88;0.68;0.38" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.8s" repeatCount="indefinite"/>
    <text x="690" y="138" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Roulette Strategy</text>
    <text x="690" y="194" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#ffffff">Optimizer</text>
  </g>
  <text x="694" y="238" font-family="Arial, sans-serif" font-size="22" fill="#d7dde4">Grid search, scoring theorique et Monte Carlo</text>
  <text x="694" y="268" font-family="Arial, sans-serif" font-size="22" fill="#d7dde4">pour visualiser des strategies roulette</text>
  <rect x="694" y="306" width="305" height="42" rx="6" fill="url(#gold)">
    <animate attributeName="opacity" values="0.86;1;0.86" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="846" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#141414">European Roulette Analytics</text>
</svg>
