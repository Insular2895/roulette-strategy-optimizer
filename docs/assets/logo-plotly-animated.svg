<svg xmlns="http://www.w3.org/2000/svg" width="132" height="28" viewBox="0 0 132 28" role="img" aria-labelledby="title desc">
  <title id="title">Plotly animated badge</title>
  <desc id="desc">Animated local README badge for Plotly visualizations.</desc>
  <defs>
    <linearGradient id="badgeBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#20252e"/>
      <stop offset="100%" stop-color="#4a5476"/>
    </linearGradient>
  </defs>
  <rect width="132" height="28" rx="6" fill="url(#badgeBg)"/>
  <rect x="0.5" y="0.5" width="131" height="27" rx="5.5" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
  <g transform="translate(10 7)" fill="#ffffff">
    <rect x="0" y="7" width="3" height="7" rx="1">
      <animate attributeName="height" values="7;13;7" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="7;1;7" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="5" y="4" width="3" height="10" rx="1">
      <animate attributeName="height" values="10;5;10" dur="1.9s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="4;9;4" dur="1.9s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="2" width="3" height="12" rx="1">
      <animate attributeName="height" values="12;8;12" dur="1.9s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;6;2" dur="1.9s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="5" width="3" height="9" rx="1">
      <animate attributeName="height" values="9;14;9" dur="1.9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="5;0;5" dur="1.9s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <polyline points="10,19 15,15 20,17 25,10" fill="none" stroke="#f2c94c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-dasharray" values="0 60;60 0" dur="2s" repeatCount="indefinite"/>
  </polyline>
  <text x="38" y="18" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Plotly</text>
  <text x="82" y="18" font-family="Inter,Arial,sans-serif" font-size="12" fill="#dfe6ff">HTML</text>
</svg>
