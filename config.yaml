roulette:
  wheel: european
  numbers: 37

bankroll:
  total: 100
  allowed_units: [1, 2, 3, 5, 10]
  exact_spend: true

objective:
  profile: recovery_hits
  min_coverage: 0.45
  max_coverage: 0.85
  big_hit_threshold: 100

search:
  method: hybrid
  combos_to_generate: 50000
  keep_top_n: 10

pareto:
  enabled: true
  candidate_pool_size: 30

stake_strategy:
  max_stake_per_bet: 10
  allow_repeated_bets: true
  merge_same_bets: true

refinement:
  enabled: true
  top_n: 10
  variants_per_strategy: 500
  min_stake_per_bet: 0
  max_stake_per_bet: 25

monte_carlo:
  sessions: 10000
  spins_per_session: 100
  initial_bankroll: 1000

robust_filter:
  enabled: true
  max_probability_bust: 0.68
  max_avg_drawdown: 1450
  max_drawdown_seen: 3600
  min_probability_profit: 0.30

profiles:
  safe:
    coverage_weight: 0.55
    profit_probability_weight: 0.20
    avg_win_weight: 0.10
    big_hit_weight: 0.05
    risk_weight: 0.10

  balanced:
    coverage_weight: 0.35
    profit_probability_weight: 0.20
    avg_win_weight: 0.20
    big_hit_weight: 0.15
    max_profit_weight: 0.10
    risk_weight: 0.10

  aggressive:
    coverage_weight: 0.20
    profit_probability_weight: 0.10
    avg_win_weight: 0.20
    big_hit_weight: 0.30
    max_profit_weight: 0.20
    risk_weight: 0.10

  robust_balanced:
    coverage_weight: 0.35
    profit_probability_weight: 0.30
    avg_win_weight: 0.15
    big_hit_weight: 0.10
    max_profit_weight: 0.05
    risk_weight: 0.20
    volatility_weight: 0.20

  recovery_hits:
    coverage_weight: 0.20
    profit_probability_weight: 0.18
    avg_win_weight: 0.22
    big_hit_weight: 0.18
    max_profit_weight: 0.18
    loss_buffer_weight: 0.30
    max_loss_cover_weight: 0.25
    risk_weight: 0.08
    volatility_weight: 0.04
